<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>hands lab</title><style>html,body{margin:0;background:#20242c}</style></head><body>
<script src="/life/voxel/three.r128.min.js"></script>
<script src="/life/town/people.js"></script>
<script>
// QA only: one person, close on the hands, to judge the fingers (not linked from anywhere)
var Q=new URLSearchParams(location.search),T=THREE;
var ren=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});ren.setSize(innerWidth,innerHeight);ren.outputEncoding=T.sRGBEncoding;document.body.appendChild(ren.domElement);
var sc=new T.Scene();sc.background=new T.Color('#3a3f4a');var cam=new T.PerspectiveCamera(30,innerWidth/innerHeight,.01,50);
sc.add(new T.HemisphereLight('#ffffff','#556',1.1));var d=new T.DirectionalLight('#fff',1.4);d.position.set(2,3,3);sc.add(d);
if(Q.get('dbg'))PEOPLE.dbg=Q.get('dbg');PEOPLE.load().then(function(){
 var g=PEOPLE.make({age:Number(Q.get('age')||35),sex:Q.get('g')==='f'?'f':'m',top:'#3d4558',skin:'#c99470',_id:'lab',earring:Q.get('er')==='1',style:Q.get('st')||undefined,lash:Q.get('g')==='f'},{own:function(m){return m}});sc.add(g);
 var u=g.userData;if(Q.get('hb'))u.human.body.visible=false;if(Q.get('hg'))g.traverse(function(o){if(o.isSkinnedMesh&&o!==u.human.body)o.visible=false});if(Q.get('red')){var bm=u.human.body.material;bm.map=null;bm.color.set('#ff0000');bm.needsUpdate=true}var pose=Q.get('pose')||'idle';
 if(pose==='forward'){u.arms.forEach(function(a){a.sh.rotation.x=-1.2;a.el.rotation.x=-.4})}
 if(pose==='cheer'){u.arms.forEach(function(a){a.sh.rotation.x=-2.8})}
 if(pose==='sit'){u.legs.forEach(function(l){l.h.rotation.x=-1.5;l.kn.rotation.x=1.5});u.arms.forEach(function(a,i){a.sh.rotation.x=-.3;a.el.rotation.x=-1.02;a.sh.rotation.z=i?-.05:.05})}
 ['a0','a1'].forEach(function(q,i){var v=Q.get(q);if(!v)return;v=v.split(',').map(Number);var a=u.arms[i];a.sh.rotation.x=v[0];a.el.rotation.x=v[1];a.sh.rotation.z=v[2]||0;if(a.hand){a.hand.rotation.z=v[3]||0;a.hand.rotation.y=v[4]||0;a.hand.rotation.x=v[5]||0}});
 window.__fist=pose==='cheer'?1:0;
 for(var i=0;i<5;i++)PEOPLE.sync(g,i*.03,.03);
 var v=Q.get('view')||'hand';
 var hb=new THREE.Vector3();g.updateMatrixWorld(true);g.traverse(function(o){if(o.isBone&&o.name==='hand_r')o.getWorldPosition(hb)});var hd=new THREE.Vector3();g.traverse(function(o){if(o.isBone&&o.name==='head')o.getWorldPosition(hd)});
 if(v==='face'){cam.position.set(hd.x+.1,hd.y+.1,hd.z+.6);cam.lookAt(hd.x,hd.y+.08,hd.z)}else if(v==='body'){cam.position.set(0,1.1,3.2);cam.lookAt(0,1,0)}else if(v==='front'){cam.position.set(hb.x,hb.y-.04,hb.z+.45);cam.lookAt(hb.x,hb.y-.08,hb.z)}else if(v==='side'){cam.position.set(hb.x-.45,hb.y-.05,hb.z+.05);cam.lookAt(hb.x,hb.y-.08,hb.z)}else if(v==='q34'){cam.position.set(hb.x-.28,hb.y-.02,hb.z+.38);cam.lookAt(hb.x,hb.y-.09,hb.z)}else if(v==='qin'){cam.position.set(hb.x+.3,hb.y-.03,hb.z+.32);cam.lookAt(hb.x,hb.y-.09,hb.z)}else if(v==='profile'){cam.position.set(1.3,1.15,.25);cam.lookAt(0,1.08,0)}else if(v==='hips'){cam.position.set(.35,1.0,1.25);cam.lookAt(0,.9,0)}else if(v==='upper'){cam.position.set(0,1.25,1.6);cam.lookAt(0,1.15,0)}else if(v==='inside'){cam.position.set(hb.x+.35,hb.y-.05,hb.z+.25);cam.lookAt(hb.x,hb.y-.08,hb.z)}else{cam.position.set(-.55,.95,.55);cam.lookAt(-.25,.82,0)}
 g.updateMatrixWorld(true);ren.render(sc,cam);window.__done=true});
</script></body></html>
