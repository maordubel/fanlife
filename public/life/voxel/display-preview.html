<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>LIFE · Display preview</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000}
.stage{position:absolute;inset:0;overflow:hidden}.sky{position:absolute;inset:0}
.day .sky{background:linear-gradient(180deg,#8fb6dd 0%,#c9dcec 58%,#e3ddd2 100%)}.night .sky{background:linear-gradient(180deg,#070b19 0%,#142040 62%,#2a2f4a 100%)}
canvas#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,0) 55%,rgba(5,8,16,.42) 100%)}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.07;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>")}
.loader{position:absolute;inset:0;display:grid;place-items:center;background:#0d1017;color:#8d98ae;font:14px system-ui,sans-serif;transition:opacity .4s;z-index:4}.loader.off{opacity:0;pointer-events:none}
</style></head><body>
<div class="stage day" id="stage"><div class="sky"></div><canvas id="gl"></canvas><div class="vig"></div><div class="grain"></div></div>
<div class="loader" id="loader">Laying voxels…</div>
<script src="/life/voxel/three.r128.min.js"></script>
<script src="/life/voxel/engine.js"></script>
<script src="/life/voxel/rooms-core.js"></script>
<script src="/life/voxel/rooms-kit.js"></script>
<script src="/life/voxel/rooms-base.js"></script>
<script src="/life/voxel/rooms-interior.js"></script>
<script src="/life/voxel/rooms-outdoor.js"></script>
<script src="/life/voxel/rooms-stadium.js"></script>
<script src="/life/voxel/rooms-universal.js"></script>
<script src="/life/voxel/rooms-showcase.js"></script>
<script src="/life/voxel/display-preview.js"></script>
</body></html>
