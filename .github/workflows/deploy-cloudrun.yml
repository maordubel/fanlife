name: Deploy · Cloud Run

# FAN LIFE runs on Google Cloud Run (scales to zero, 2 GB; one instance takes 60 requests because public pages come from the front door's shelf) behind a Cloudflare Worker, since Vercel's Hobby CPU cap
# shut it off on 10.11.2026. GitHub builds the site, packs it into a container and deploys it. No key is stored
# anywhere: GitHub proves who it is to Google (OIDC, keyless), and deploy/cloudrun/target.json says where to go.
# The server keys come from this repository's own secrets and go only to the owner's Cloud Run service (owner's
# approval, 11.11.2026), so the cron, social and Telegram jobs that call the site keep the keys they already use.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudrun
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Target configured?
        id: cfg
        run: |
          T=deploy/cloudrun/target.json
          for k in project region service repository workloadIdentityProvider serviceAccount; do
            echo "$k=$(jq -r ".$k" $T)" >> "$GITHUB_OUTPUT"
          done
          if [ -z "$(jq -r .workloadIdentityProvider $T)" ]; then
            echo "::notice title=Cloud Run not configured yet::Fill deploy/cloudrun/target.json."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else echo "ready=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ready == 'true'
        with: { node-version: 22, cache: npm }
      - name: Build (standalone)
        if: steps.cfg.outputs.ready == 'true'
        env:
          NEXT_OUTPUT: standalone
          NODE_OPTIONS: --max-old-space-size=6144
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://afxpjfxwpdjvlmuoawda.supabase.co' }}
          # the project's public anon key — it ships in every browser bundle by design (RLS guards the data); a repository
          # variable overrides it. Without it the build fell back to the device-only preview: no accounts, no market.
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFmeHBqZnh3cGRqdmxtdW9hd2RhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0NzY4NDUsImV4cCI6MjEwMzA1Mjg0NX0.DxpeH8L9yzRCOSdBzrnZLs7NztYs65psQoroYiCtY2U' }}
          NEXT_PUBLIC_FAN_LIFE_EVALUATION: ${{ vars.NEXT_PUBLIC_FAN_LIFE_EVALUATION }}
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Bundle
        if: steps.cfg.outputs.ready == 'true'
        run: |
          B=deploy/cloudrun/bundle && rm -rf $B && mkdir -p $B
          cp -a .next/standalone/. $B/
          mkdir -p $B/.next && cp -a .next/static $B/.next/static
          # the standalone output already holds a public/ with the traced files; copy INTO it, never public/public
          mkdir -p $B/public && cp -a public/. $B/public/
          test -f $B/public/brand/fanlife/logo-96.png && test ! -e $B/public/public
          echo "public files: $(find $B/public -type f | wc -l) of $(find public -type f | wc -l)"
          cp deploy/space/proxy.mjs $B/deploy-proxy.mjs && cp deploy/space/start.sh $B/deploy-start.sh
          du -sh $B
      - uses: google-github-actions/auth@v2
        if: steps.cfg.outputs.ready == 'true'
        with:
          workload_identity_provider: ${{ steps.cfg.outputs.workloadIdentityProvider }}
          service_account: ${{ steps.cfg.outputs.serviceAccount }}
      - uses: google-github-actions/setup-gcloud@v2
        if: steps.cfg.outputs.ready == 'true'
      - name: Image
        if: steps.cfg.outputs.ready == 'true'
        id: img
        run: |
          R="${{ steps.cfg.outputs.region }}"
          IMG="$R-docker.pkg.dev/${{ steps.cfg.outputs.project }}/${{ steps.cfg.outputs.repository }}/site:${GITHUB_SHA::12}"
          gcloud auth configure-docker "$R-docker.pkg.dev" --quiet
          docker build -t "$IMG" deploy/cloudrun
          docker push "$IMG"
          echo "image=$IMG" >> "$GITHUB_OUTPUT"
      - name: Server keys
        if: steps.cfg.outputs.ready == 'true'
        env:
          CRON_SECRET: ${{ secrets.FAN_LIFE_CRON_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          TELEGRAM_APP_URL: ${{ secrets.TELEGRAM_APP_URL }}
          THESPORTSDB_KEY: ${{ secrets.THESPORTSDB_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FAN_LIFE_ADMIN_KEY: ${{ secrets.FAN_LIFE_ADMIN_KEY }}
        run: |
          python3 - <<'PY2'
          import os
          names = ['CRON_SECRET','TELEGRAM_BOT_TOKEN','TELEGRAM_WEBHOOK_SECRET','TELEGRAM_APP_URL','THESPORTSDB_KEY','SUPABASE_SERVICE_ROLE_KEY','FAN_LIFE_ADMIN_KEY']
          have = [n for n in names if os.environ.get(n)]
          arg = ('^##^' + '##'.join(n + '=' + os.environ[n] for n in have)) if have else ''
          open(os.environ['RUNNER_TEMP'] + '/envs', 'w').write(arg)
          print('server keys:', ', '.join(have) or 'none')
          PY2
      - name: Deploy
        if: steps.cfg.outputs.ready == 'true'
        run: |
          EXTRA=()
          ENVS="$(cat "$RUNNER_TEMP/envs")"
          [ -n "$ENVS" ] && EXTRA=(--update-env-vars "$ENVS")
          gcloud run deploy "${{ steps.cfg.outputs.service }}" \
            --project "${{ steps.cfg.outputs.project }}" --region "${{ steps.cfg.outputs.region }}" \
            --image "${{ steps.img.outputs.image }}" --port 8080 --memory 2Gi --cpu 1 \
            --min-instances 0 --max-instances 3 --concurrency 60 --cpu-boost --timeout 300 \
            --no-invoker-iam-check "${EXTRA[@]}" --quiet
          URL=$(gcloud run services describe "${{ steps.cfg.outputs.service }}" --project "${{ steps.cfg.outputs.project }}" --region "${{ steps.cfg.outputs.region }}" --format 'value(status.url)')
          echo "::notice title=Cloud Run::$URL"
