name: Trivia editorial diagnostic
on:
  push:
    branches: [codex/trivia-editorial-diagnostic]
jobs:
  editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/trivia/editorial.test.ts --maxWorkers=1 --minWorkers=1
