# DUBEL TEAM social plan (25.10.2026): every two hours, 08:00–22:00 Athens time, one ready post to the owner's Telegram.
# The site holds the plan (schema marketing on Football Master) and claims each due post once; this run only sends it.
# Idle runs are one cheap request.
name: DUBEL TEAM plan
on:
  schedule:
    - cron: '1,31 5-21 * * *'  # every plan slot is on :00 or :30 Athens time; 34 calls a day instead of 204 (9.11.2026)
  workflow_dispatch:
permissions: {}
concurrency:
  group: marketing-telegram
  cancel-in-progress: false
jobs:
  run:
    if: vars.FAN_LIFE_RESEARCH_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      FAN_LIFE_URL: ${{ vars.FAN_LIFE_RESEARCH_URL }}
      CRON_SECRET: ${{ secrets.FAN_LIFE_CRON_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      # the business Facebook Page + its Instagram (docs/fanlife/53-meta-publishing.md); on when META_AUTOPUBLISH = 1, or when the
      # films switch STORIES_SOCIAL_AUTOPUBLISH = 1 is set (owner, 10.11.2026: "marketing is not publishing by itself — fix it")
      META_AUTOPUBLISH: ${{ vars.META_AUTOPUBLISH || vars.STORIES_SOCIAL_AUTOPUBLISH }}
      META_PAGE_ID: ${{ vars.META_PAGE_ID }}
      META_IG_USER_ID: ${{ vars.META_IG_USER_ID }}
      META_APPS: ${{ vars.META_APPS }}
      META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
      # the business X account (docs/fanlife/54-x-publishing.md); off unless X_AUTOPUBLISH = 1
      X_AUTOPUBLISH: ${{ vars.X_AUTOPUBLISH }}
      X_APPS: ${{ vars.X_APPS }}
      X_LINKS: ${{ vars.X_LINKS }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: The kit renderer (one package, cached)
        uses: actions/cache@v4
        with:
          path: scripts/marketing/kit/node_modules
          key: marketing-kit-sharp-0.34.5-qrcode-1.5.4-${{ runner.os }}
      - run: test -d scripts/marketing/kit/node_modules/sharp -a -d scripts/marketing/kit/node_modules/qrcode || npm install --prefix scripts/marketing/kit --no-save --no-audit --no-fund sharp@0.34.5 qrcode@1.5.4
        continue-on-error: true
      - run: node scripts/marketing/telegram-send.mjs
