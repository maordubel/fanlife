name: olyhist fetch (temporary)
on:
  push:
    branches: [claude/olympiacos-all-players]
    paths: [.github/workflows/olyhist-fetch-tmp.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npx tsx scripts/ingest/clubs/olympiacos-history-fetch.ts
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add research-data/olympiacos-history && git commit -m "olympiacos-history: players table snapshot" && git push
