name: FAN LIFE · feature videos (weekly)
# Owner, 2.11.2026: 7 challenge Shorts + 1 feature film a week, clubs in rotation, produced automatically and sent to his
# Telegram for approval; Claude uploads to YouTube once he approves. Sunday ~17:15 Athens builds NEXT week's batch.
# Run it by hand from Actions → "FAN LIFE · feature videos" → Run workflow (optional: a week like 2026-W47).
on:
  schedule:
    - cron: '17 15 * * 0'
  push:     # until this file is on main (where the schedule lives), a change to trigger.txt runs it once
    paths: ['scripts/football-stories/features/trigger.txt']
  workflow_dispatch:
    inputs:
      week: {description: 'ISO week, e.g. 2026-W47 (empty = next week)', required: false, default: ''}
      send: {description: 'Send to Telegram', required: false, default: 'yes'}
permissions:
  contents: write
concurrency:
  group: features-weekly
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      FAN_LIFE_URL: ${{ vars.FAN_LIFE_RESEARCH_URL }}
      CRON_SECRET: ${{ secrets.FAN_LIFE_CRON_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      KOKORO_DIR: /home/runner/models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Tools
        run: |
          npm ci --no-audit --no-fund
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q numpy pillow playwright kokoro-onnx soundfile faster-whisper fonttools brotli
          python -m playwright install --with-deps chromium > /dev/null
      - name: Voice model (cached)
        id: kokoro
        uses: actions/cache@v4
        with: {path: ~/models, key: kokoro-v1.0}
      - if: steps.kokoro.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/models
          curl -sSL -o ~/models/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -sSL -o ~/models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - name: The week's plan, from the archive
        run: node --require ./scripts/master/server-only.cjs --import tsx scripts/football-stories/features/build-week.mts ${{ inputs.week }}
      - name: Render the Shorts and the film
        run: |
          wk=$(ls -t scripts/football-stories/features/weeks/*.json | head -1)
          echo "WEEK_JSON=$wk" >> "$GITHUB_ENV"
          python3 scripts/football-stories/features/shorts.py "$wk" "$RUNNER_TEMP/out"
          python3 scripts/football-stories/features/explainer.py "$wk" "$RUNNER_TEMP/out" || echo "::warning::the film failed; the Shorts still go out"
      - name: Publish the files (branch features-publish)
        run: |
          cp "$WEEK_JSON" "$RUNNER_TEMP/out/week.json"
          cd "$RUNNER_TEMP/out" && git init -q && git checkout -q -b features-publish
          git config user.name "fanlife-features" && git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -qm "Feature videos $(basename "$WEEK_JSON" .json) from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" features-publish
      - name: Send to Telegram
        if: inputs.send != 'no'
        run: |
          python3 scripts/football-stories/features/delivery.py "$WEEK_JSON" "$RUNNER_TEMP/out" "https://raw.githubusercontent.com/${{ github.repository }}/features-publish" > "$RUNNER_TEMP/delivery.json"
          node scripts/football-stories/matchday/deliver.mjs "$RUNNER_TEMP/delivery.json"
