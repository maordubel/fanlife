name: Football Fairy Tales · episode narration
# The narration of one episode (owner chose Leda for every language, 11.11.2026): every shot in English and the club's
# language, each take checked by Whisper (no skipped words, no double reads). The takes sit on a temporary branch long
# enough for the studio session to fetch them, then the branch is deleted.
on:
  workflow_dispatch:
    inputs:
      episode: {description: 'episode file name', default: 'hapoel-tel-aviv-good-morning'}
  push:
    paths: ['scripts/football-stories/studio/fairytales/episodes/*.json', 'scripts/football-stories/studio/fairytales/narrate.py']
permissions:
  contents: write
concurrency:
  group: fairytales-narrate
  cancel-in-progress: true
jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      EPISODE: ${{ inputs.episode || 'hapoel-tel-aviv-good-morning' }}
      BRANCH: fairytales-narration-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Engines
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q numpy faster-whisper
      - name: Narrate
        working-directory: scripts/football-stories
        run: python3 -m studio.fairytales.narrate "studio/fairytales/episodes/$EPISODE.json" "$RUNNER_TEMP/narration"
      - name: Publish the takes
        if: always()
        run: |
          cd "$RUNNER_TEMP/narration"
          git init -q && git checkout -q -b "$BRANCH"
          git config user.name "fanlife-narration" && git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -qm "Fairy Tales narration $EPISODE $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$BRANCH"
          echo "branch: $BRANCH"
      - name: Keep the takes for the studio session, then delete the temporary branch
        if: always()
        run: |
          sleep 2400
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" --delete "$BRANCH" || true
