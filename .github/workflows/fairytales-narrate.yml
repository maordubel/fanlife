name: Football Fairy Tales · episode narration
# The narration of one episode (owner chose Leda for every language, 11.11.2026): every shot in English and the club's
# language, each take checked by Whisper (no skipped words, no double reads). The takes sit on a temporary branch long
# enough for the studio session to fetch them, then the branch is deleted.
on:
  workflow_dispatch:
    inputs:
      episode: {description: 'episode file name', default: 'hapoel-tel-aviv-good-morning'}
  push:
    paths: ['scripts/football-stories/studio/fairytales/episodes/*.retake']
permissions:
  contents: write
jobs:
  narrate:
    runs-on: ubuntu-latest
    concurrency:
      group: fairytales-narrate
      cancel-in-progress: true
    timeout-minutes: 90
    env:
      # Football Fairy Tales has its own free-tier key (owner, 12.11.2026), kept apart from the studio's GEMINI_API_KEY
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_KIDS }}
      EPISODE: ${{ inputs.episode || 'hapoel-tel-aviv-good-morning' }}
      BRANCH: fairytales-narration-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Engines
        timeout-minutes: 10
        run: |
          pip install -q numpy faster-whisper imageio-ffmpeg
          command -v ffmpeg || sudo ln -sf "$(python -c 'import imageio_ffmpeg as f; print(f.get_ffmpeg_exe())')" /usr/local/bin/ffmpeg
          ffmpeg -version | head -1
      - name: Narrate
        timeout-minutes: 45
        working-directory: scripts/football-stories
        run: |
          RETAKE="studio/fairytales/episodes/$EPISODE.retake"
          [ -f "$RETAKE" ] && export FT_ONLY="$(cat "$RETAKE")"
          python3 -m studio.fairytales.narrate "studio/fairytales/episodes/$EPISODE.json" "$RUNNER_TEMP/narration"
      - name: Publish the takes
        if: always()
        run: |
          cd "$RUNNER_TEMP/narration"
          git init -q && git checkout -q -b "$BRANCH"
          git config user.name "fanlife-narration" && git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -qm "Fairy Tales narration $EPISODE $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$BRANCH"
          echo "branch: $BRANCH"
  cleanup:
    # a separate job, outside the narration's concurrency group, so a long wait never blocks the next retake
    needs: narrate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Keep the takes for the studio session, then delete the temporary branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 2400
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/fairytales-narration-${{ github.run_id }}" || true
