name: LIFE · character assets
# LIFE: skinned human characters with facial morph targets, built on the runner for free (public repository).
# Headless Blender (the `bpy` wheel) + MPFB2 (MakeHuman for Blender) + the MakeHuman CC0 asset packs, driven by
# scripts/life/assets/. A push to claude/life-assets that touches the pipeline, or a dispatch, builds the cast,
# the clips, the manifest and the previews, and commits them back to the SAME branch. It never writes to main.
# docs/life/ASSETS-PIPELINE.md is the manual.
on:
  workflow_dispatch:
    inputs:
      only: {description: 'Character ids, comma-separated (empty = whole cast)', default: ''}
  push:
    branches: [claude/life-assets]
    paths: ['scripts/life/assets/**', '.github/workflows/life-assets.yml']
permissions:
  contents: write
concurrency: {group: 'life-assets-${{ github.ref }}', cancel-in-progress: true}
env:
  MPFB_SHA: 650c5c53bd6989a8ac264f31fa1d11d4a0c7bd8a
  BPY_VERSION: 5.3.0
  PACKS_KEY: v1
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip, cache-dependency-path: scripts/life/assets/requirements.txt}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Asset packs (cached)
        uses: actions/cache@v4
        with: {path: '${{ runner.temp }}/packs', key: 'life-asset-packs-${{ env.PACKS_KEY }}-${{ hashFiles(''scripts/life/assets/packs.txt'') }}'}
      - name: Tools
        run: |
          pip install -r scripts/life/assets/requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libgl1 libegl1 >/dev/null
          git clone -q https://github.com/makehumancommunity/mpfb2 "$RUNNER_TEMP/mpfb2" && git -C "$RUNNER_TEMP/mpfb2" checkout -q "$MPFB_SHA"
          (cd "$RUNNER_TEMP/mpfb2/src" && zip -qr "$RUNNER_TEMP/mpfb.zip" mpfb)
      - name: Build
        env:
          LIFE_ONLY: '${{ inputs.only }}'
          LIFE_PACKS: '${{ runner.temp }}/packs'
          LIFE_MPFB_ZIP: '${{ runner.temp }}/mpfb.zip'
          LIFE_MPFB_SRC: '${{ runner.temp }}/mpfb2'
          LIFE_WORK: '${{ runner.temp }}/life-work'
        run: bash scripts/life/assets/run.sh
      - name: Commit back to this branch
        if: always()
        run: |
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A public/life/assets docs/life/assets-preview docs/life/assets-catalogue scripts/life/assets/vendor 2>/dev/null || true
          git diff --cached --quiet && { echo 'nothing to commit'; exit 0; }
          git commit -q -m "LIFE assets: built by the runner (${GITHUB_SHA::7}) [skip ci]"
          git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}"
