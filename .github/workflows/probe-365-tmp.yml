name: probe-365 (temporary)
on:
  push:
    branches: ['claude/archive-refresh-2026-11-12']
    paths: ['scripts/ingest/clubs/league-lineups.ts', 'scripts/ingest/clubs/probe-365.mjs', '.github/workflows/probe-365-tmp.yml']
permissions: {contents: write}
concurrency: {group: probe-365, cancel-in-progress: true}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: node scripts/ingest/clubs/probe-365.mjs
      - run: npm ci
      - name: League feed for every club (temporary run on the review branch)
        env: {LL_DEBUG: '1'}
        run: |
          for id in raja-casablanca wydad-casablanca al-ahly zrinjski-mostar hapoel-petah-tikva celtic olympiacos panathinaikos aek-athens st-pauli hapoel-tel-aviv; do
            npx tsx scripts/ingest/clubs/league-lineups.ts --club "$id" --max 200 || echo "FAILED $id"
          done
      - name: Commit the collected files to this review branch
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add club-packs/*/wave-league-lineups-2026-10-10.json club-packs/*/ingest.json
          git commit -m "league feed: collected on the review branch" || exit 0
          git pull --rebase -q origin claude/archive-refresh-2026-11-12 && git push -q origin HEAD:claude/archive-refresh-2026-11-12
