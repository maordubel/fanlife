name: Football Stories worker
# Makes the films queued in the owner's studio (/master/stories). No terminal: queue a film in the studio and this
# listener (stories-watch.yml) starts this worker within a few minutes; the schedule below is only a fallback.
# One job per run: a documentary, a CLASSIFIED FILE (comic/produce.py, only with the owner's approval recorded in the
# studio) or an I WAS THERE vlog (matchday/vlog_auto.py) — studio/kinds.py. The peek says which kind, and only that
# kind's extra tools are installed. Runner limit: the job allows 350 minutes; a 25-minute documentary takes ~1–2 h, a
# CLASSIFIED FILE ~2½ h at most (its own workflow allows 150 min), a vlog ~1 h (survey, writer, film, reel).
# Paid answers (script, voice) are kept per job between runs, so a retry never pays twice.
# Secrets: FAN_LIFE_CRON_SECRET (required) · ANTHROPIC_API_KEY / OPENAI_API_KEY / GEMINI_API_KEY (one writer) ·
# ELEVENLABS_API_KEY (optional premium voice; without it the free Kokoro British voice is used).
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'  # fallback only: the listener starts films (9.11.2026, fewer Vercel calls)
permissions:
  contents: write  # a CLASSIFIED FILE written by the studio is committed to main (studio/kinds.run_casefile)
concurrency:
  group: stories-worker
  cancel-in-progress: false
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      STORIES_URL: ${{ vars.FAN_LIFE_RESEARCH_URL || 'https://fanlife.dubelteam.com' }}
      FAN_LIFE_CRON_SECRET: ${{ secrets.FAN_LIFE_CRON_SECRET }}
    steps:
      - name: Anything to make?
        id: peek
        run: |
          if [ ${#FAN_LIFE_CRON_SECRET} -lt 32 ]; then echo "::warning::FAN_LIFE_CRON_SECRET is not set"; echo "next=" >> "$GITHUB_OUTPUT"; exit 0; fi
          peek=$(curl -s --retry 2 --retry-delay 20 --max-time 70 -X POST -H "Authorization: Bearer $FAN_LIFE_CRON_SECRET" -H 'Content-Type: application/json' \
            -d "{\"op\":\"peek\",\"worker\":\"peek-$GITHUB_RUN_ID\"}" "$STORIES_URL/api/master/stories/worker" || true)
          next=$(printf '%s' "$peek" | python3 -c "import sys,json;print(json.load(sys.stdin).get('next') or '')" 2>/dev/null || true)
          kind=$(printf '%s' "$peek" | python3 -c "import sys,json;print(json.load(sys.stdin).get('kind') or 'film')" 2>/dev/null || echo film)
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          [ -n "$next" ] && echo "Job waiting: $next ($kind)" || echo "No job waiting."
      - if: steps.peek.outputs.next != ''
        uses: actions/checkout@v4
      - if: steps.peek.outputs.next != ''
        uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - if: steps.peek.outputs.next != ''
        name: Club archives and map data
        # the studio researches every club but Hapoel from its compiled pack (content/compiled/<club>.json, not in git)
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund world-atlas@2
          npm run clubs:precompile
      - if: steps.peek.outputs.next != ''
        uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - if: steps.peek.outputs.next != ''
        name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q numpy pillow opencv-python-headless playwright kokoro-onnx soundfile fonttools brotli pillow-heif
          # misaki: the G2P the voice was trained on (studio/pronounce.py); without it the voice falls back to espeak
          pip install -q misaki num2words regex spacy && python -m spacy download en_core_web_sm -q
          python -m playwright install --with-deps chromium > /dev/null
      - if: steps.peek.outputs.next != ''
        name: HyperFrames (pinned) for the cartoon Shorts and VOX-HF
        working-directory: scripts/football-stories/studio/hyperframes
        env: {HYPERFRAMES_NO_TELEMETRY: '1', HYPERFRAMES_SKIP_SKILLS: '1', HYPERFRAMES_NO_UPDATE_CHECK: '1'}
        run: |
          npm ci --no-audit --no-fund
          npx hyperframes browser ensure || echo "::warning::HyperFrames browser not ready — Shorts fall back to the still montage"
      - if: steps.peek.outputs.next != '' && steps.peek.outputs.kind == 'classified'
        name: CLASSIFIED tools (the composer's layers, depth model)
        run: pip install -q opencv-python-headless onnxruntime
      - if: steps.peek.outputs.next != '' && steps.peek.outputs.kind == 'classified'
        name: Depth model (Depth Anything V2 Small, Apache-2.0 — free, cached)
        id: depth
        uses: actions/cache@v4
        with: {path: ~/depth, key: depth-anything-v2-small-onnx-v1}
      - if: steps.peek.outputs.next != '' && steps.peek.outputs.kind == 'classified' && steps.depth.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/depth
          curl -fsSL --retry 3 -o ~/depth/depth-anything-v2-small.onnx \
            https://huggingface.co/onnx-community/depth-anything-v2-small/resolve/main/onnx/model.onnx \
            || { rm -f ~/depth/depth-anything-v2-small.onnx; echo "::warning::The depth model did not download — the composer falls back to its saliency layers"; }
      - if: steps.peek.outputs.next != '' && steps.peek.outputs.kind == 'vlog'
        name: I WAS THERE tools (footage survey, speech check, HEIC stills, HDR tone map)
        run: |
          pip install -q "opencv-python-headless<5" faster-whisper
          ffmpeg -hide_banner -filters | grep -q zscale || { echo "::error::ffmpeg has no zscale (HDR tone map)"; exit 1; }
      - if: steps.peek.outputs.next != '' && steps.peek.outputs.kind != 'vlog'
        name: Narrator check (Gemini's free speech model is checked word by word against the script)
        run: pip install -q faster-whisper || echo "::warning::faster-whisper did not install — the free local narrator reads every film"
      - if: steps.peek.outputs.next != ''
        name: Voice model (free, cached)
        id: kokoro
        uses: actions/cache@v4
        with: {path: ~/models, key: kokoro-v1.0}
      - if: steps.peek.outputs.next != '' && steps.kokoro.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/models
          curl -sSL -o ~/models/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -sSL -o ~/models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - if: steps.peek.outputs.next != ''
        name: Moving-art library listing
        # The owner's "Dynamic Football Fan Art" folder (studio/cinema/library.py): listed every run, downloaded and cut
        # out once — the prepared pieces live in the cache below, keyed by the listing, so only a new file is fetched.
        id: cinemalib
        continue-on-error: true
        working-directory: scripts/football-stories
        run: |
          python -m studio.cinema.library list --out "$RUNNER_TEMP/cinema-listing.json"
          echo "key=$(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/cinema-listing.json'))['key'])")" >> "$GITHUB_OUTPUT"
      - if: steps.peek.outputs.next != ''
        name: Moving-art library (cached)
        uses: actions/cache@v4
        with:
          path: ~/cinema-lib
          key: cinema-lib-${{ steps.cinemalib.outputs.key || 'none' }}
          restore-keys: cinema-lib-
      - if: steps.peek.outputs.next != ''
        name: Moving-art library (new pieces)
        continue-on-error: true
        working-directory: scripts/football-stories
        run: |
          [ -f "$RUNNER_TEMP/cinema-listing.json" ] || exit 0
          python -m studio.cinema.library sync --listing "$RUNNER_TEMP/cinema-listing.json" --dest ~/cinema-lib --report "$RUNNER_TEMP/cinema-sync.json"
      - if: steps.peek.outputs.next != ''
        name: This film's checkpoints
        uses: actions/cache/restore@v4
        with:
          path: |
            stories-jobs/${{ steps.peek.outputs.next }}/cache
            stories-jobs/${{ steps.peek.outputs.next }}/*.json
          key: stories-${{ steps.peek.outputs.next }}-${{ github.run_id }}
          restore-keys: stories-${{ steps.peek.outputs.next }}-
      - if: steps.peek.outputs.next != ''
        name: Make the film
        working-directory: scripts/football-stories
        env:
          STORIES_JOBS: ${{ github.workspace }}/stories-jobs
          STORIES_PEEK: ${{ steps.peek.outputs.next }}
          KOKORO_DIR: /home/runner/models
          STORIES_WORKERS: '4'
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_KIDS: ${{ secrets.GEMINI_API_KEY_KIDS }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          # the Reel to the owner's linked Telegram chat when the brief asks for it (studio v3)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # free unless the owner turns paid providers on (repository variables)
          STORIES_ALLOW_PAID: ${{ vars.STORIES_ALLOW_PAID }}
          STORIES_VOICE: ${{ vars.STORIES_VOICE }}
          STORIES_MASTER_PRESET: medium
          # scan the owner's Drive live for this story's packs (studio/drive_scan.py)
          STORIES_DRIVE_SCAN: '1'
          # CLASSIFIED (studio/kinds.py → comic/produce.py): the depth model (kinds.py sets the Take B narrator itself)
          CLASSIFIED_DEPTH_MODEL: /home/runner/depth/depth-anything-v2-small.onnx
          STORIES_GEMINI_MODEL: ${{ vars.STORIES_GEMINI_MODEL }}
          # the moving-art library the cinema animates (absent → the film renders without it)
          STORIES_CINEMA_LIB: /home/runner/cinema-lib
        run: python -m studio.worker
      - name: Check production still exists
        if: always() && steps.peek.outputs.next != ''
        id: checkpoint
        env:
          JOB_ID: ${{ steps.peek.outputs.next }}
        run: |
          result=$(curl --fail -s --retry 2 --retry-delay 20 --retry-all-errors --max-time 70 -X POST -H "Authorization: Bearer $FAN_LIFE_CRON_SECRET" -H 'Content-Type: application/json' \
            -d "{\"op\":\"checkpoint_allowed\",\"worker\":\"cache-$GITHUB_RUN_ID\",\"id\":\"$JOB_ID\"}" "$STORIES_URL/api/master/stories/worker")
          printf '%s' "$result" | python3 -c 'import json,sys; print("allowed=" + str(bool(json.load(sys.stdin).get("allowed"))).lower())' >> "$GITHUB_OUTPUT"
      - if: always() && steps.checkpoint.outputs.allowed == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            stories-jobs/${{ steps.peek.outputs.next }}/cache
            stories-jobs/${{ steps.peek.outputs.next }}/*.json
          key: stories-${{ steps.peek.outputs.next }}-${{ github.run_id }}
