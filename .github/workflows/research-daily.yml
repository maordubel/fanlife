name: research-daily
# Every day: pull fresh data for every club (archives, UEFA matches/elevens), measure what each club now holds,
# write a short report (with an optional AI triage), and open ONE pull request. Nothing is approved or published here
# (rules 92, 93, 114); collected rows arrive unreviewed. Click "Run workflow" to run it now.
# 10.11.2026 (research desk): the UEFA pull reads the newest 20, then 30 ties the wave does not hold yet (history grows
# every day instead of stopping at 80) and re-reads 20 held ties for positions and birth dates; a discovered UEFA team
# id is saved; the staged clubs get their "what a yes opens" preview; the report names what waits for the owner.
on:
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * *'
permissions:
  contents: write
  pull-requests: write
concurrency: {group: research-daily, cancel-in-progress: false}
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - name: Archives (polite, small batch per club)
        continue-on-error: true
        run: |
          for f in research-profiles/*.json; do
            id=$(basename "$f" .json)
            node -e "process.exit((JSON.parse(require('fs').readFileSync('$f','utf8')).archive||[]).length?0:1)" || continue
            npm run -s research:collect -- "$id" --max-requests 20 || echo "::warning::$id archive pull failed"
          done
      - name: UEFA matches and elevens (every club that has ingest.json)
        env:
          THESPORTSDB_KEY: ${{ secrets.THESPORTSDB_KEY }}
        run: |
          failed=""
          for dir in club-packs/*/ research-staging/*/; do
            id=$(basename "$dir")
            [ -f "$dir/ingest.json" ] || continue
            npm run -s club:wave -- --club "$id" --max 20 --backfill 30 --refresh 20 2>&1 | tee -a wave.log || failed="$failed $id"
          done
          [ -z "$failed" ] || echo "::warning::club:wave failed for:$failed"
      - name: League and cup nights, scoresheets and positions (365Scores × LiveScore, every club with ingest.json)
        # 12.11.2026 — the league feed runs every day now (it had run once, on 10.10): new nights, agreed scorers and agreed lines
        continue-on-error: true
        run: |
          for dir in club-packs/*/; do
            id=$(basename "$dir")
            [ -f "$dir/ingest.json" ] || continue
            npx tsx scripts/ingest/clubs/league-lineups.ts --club "$id" --max 30 2>&1 | tee -a wave.log || echo "::warning::$id league feed failed"
          done
      - name: Census
        run: npm run -s research:census -- --out census.json
      - name: Club history and careers (Celtic every match; Olympiacos careers from olympiacos-history.gr)
        # 13.11.2026 — the current and last season are re-read daily (the file accumulates); careers refresh with the site's table
        continue-on-error: true
        run: |
          y=$(date +%Y)
          npx tsx scripts/ingest/clubs/history-scotland.ts --club celtic --from $((y-1)) --to $y 2>&1 | tail -3
          node --require ./scripts/master/server-only.cjs --import tsx scripts/ingest/clubs/olympiacos-history-players.ts 2>&1 | tail -2
      - name: Head-to-head ledger for the studio and the next-match card
        continue-on-error: true
        run: npm run -s h2h:build
      - name: What a yes would open (staged clubs)
        run: npm run -s research:desk-preview
      - name: Report (+ AI triage when the key exists)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run -s research:daily-report -- --census census.json --wave-log wave.log
      - uses: peter-evans/create-pull-request@v6
        with:
          branch: research-daily/auto
          title: 'research-daily: fresh data and report'
          commit-message: 'research-daily: collected data, wave-auto and report'
          add-paths: |
            research-data/**
            club-packs/**/wave-auto.json
            club-packs/**/wave-league-lineups-*.json
            club-packs/celtic/wave-history-scotland.json
            club-packs/olympiacos/wave-olympiacos-history.json
            research-staging/**/wave-auto.json
            research-staging/**/ingest.json
            club-packs/**/ingest.json
            research-reports/**
            content/generated/head-to-head.json
          body: 'Automatic daily pull. New rows are unreviewed; see research-reports/ for what changed per club. New clubs wait for the owner on the research desk (Control room → Research).'
