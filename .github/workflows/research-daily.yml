name: research-daily
on:
  workflow_dispatch:
    inputs:
      club:
        description: 'Optional club ID for a manual run. Leave blank to use the daily rotation.'
        type: string
      league_depth:
        description: 'Maximum number of finished league and cup fixtures to inspect'
        type: number
        default: 30
      publish:
        description: 'Publish verified data to the default branch'
        type: boolean
        default: true
  schedule:
    - cron: '41 5 * * *'
      timezone: Europe/Athens

permissions:
  contents: write
  actions: write

concurrency:
  group: fanlife-research-writes
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Load research sources added through the control room
        env:
          SITE: ${{ vars.FAN_LIFE_RESEARCH_URL }}
          SCHEDULER_KEY: ${{ secrets.FAN_LIFE_CRON_SECRET }}
        run: |
          mkdir -p "$RUNNER_TEMP/fanlife-research-overlays"
          echo "RESEARCH_OVERLAY_DIR=$RUNNER_TEMP/fanlife-research-overlays" >> "$GITHUB_ENV"
          if [[ "$SITE" != https://* || -z "$SCHEDULER_KEY" ]]; then
            echo 'Using the repository source profiles.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if curl --fail --silent --show-error --max-time 20 --header "Authorization: Bearer $SCHEDULER_KEY" "${SITE%/}/api/master/research/profiles-export" --output "$RUNNER_TEMP/research-profiles.json"; then
            node -e 'const fs=require("node:fs");const p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/research-profiles.json","utf8"));for(const [id,data] of Object.entries(p.profiles||{}))if(/^[a-z][a-z0-9-]{1,60}$/.test(id))fs.writeFileSync(process.env.RUNNER_TEMP+"/fanlife-research-overlays/"+id+".json",JSON.stringify(data))'
          else
            echo 'Control-room profiles could not be loaded. Repository sources were used.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Research today's club
        id: research
        env:
          CLUB: ${{ inputs.club }}
          LEAGUE_DEPTH: ${{ inputs.league_depth || 30 }}
          THESPORTSDB_KEY: ${{ secrets.THESPORTSDB_KEY }}
          RESEARCH_DATA_DIR: research-data
        run: |
          args=(--league-depth "$LEAGUE_DEPTH")
          if [[ -n "$CLUB" ]]; then args+=(--club "$CLUB"); fi
          node --require ./scripts/master/server-only.cjs --import tsx scripts/research/daily.ts "${args[@]}"
      - name: Verify archive and player linkage
        run: |
          npm run repo:hygiene
          npx vitest run tests/research/daily.test.ts tests/master/schedules.test.ts tests/people/registry.test.ts --testTimeout=120000
      - name: Save verified research
        id: publish
        if: github.ref_name == github.event.repository.default_branch && (github.event_name == 'schedule' || inputs.publish)
        env:
          CLUB: ${{ steps.research.outputs.club_id }}
          DAY: ${{ steps.research.outputs.day }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$CLUB" =~ ^[a-z][a-z0-9-]+$ ]]
          [[ "$DAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          git config user.name 'fanlife-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A -- research-data
          for dir in "club-packs/$CLUB" "research-staging/$CLUB"; do
            for file in ingest.json wave-auto.json wave-league-lineups-2026-10-10.json wave-history-scotland.json wave-olympiacos-history.json; do
              [[ ! -f "$dir/$file" ]] || git add -- "$dir/$file"
            done
          done
          git add -- content/generated/people-stints.json content/manual/people-ids.json content/generated/rumble-prices-v3.json content/generated/head-to-head.json
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Research $CLUB for $DAY"
          git fetch origin "$DEFAULT_BRANCH"
          git rebase "origin/$DEFAULT_BRANCH"
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
          echo 'saved=true' >> "$GITHUB_OUTPUT"
      # A push authenticated by GITHUB_TOKEN does not start the normal push-based deployment.
      - name: Deploy the updated archive
        if: steps.publish.outputs.saved == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run deploy-cloudrun.yml --ref "$DEFAULT_BRANCH"
