name: Football Stories · directors' pitches
# Each of the three directors pitches the next film he wants to make — another club and another event each time, never
# one already filmed or pitched in the last two weeks (scripts/football-stories/studio/pitch.py, docs/fanlife/66 §5).
# Runs every morning (04:23 UTC ≈ 06:23 Athens) and whenever the owner presses "Ask for new pitches" in the studio
# (Desk → Studio → Directors): the listener (stories-watch.yml) sees the request and starts this workflow. Google's free
# writer is wait-aware: a spent day or a busy minute ends the round with what it has, and the listener starts it again
# by itself when the quota is back. Nothing here costs money. Secrets: FAN_LIFE_CRON_SECRET · GEMINI_API_KEY.
on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'
permissions:
  contents: read
concurrency:
  group: stories-pitch
  cancel-in-progress: false
jobs:
  pitch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      STORIES_URL: ${{ vars.FAN_LIFE_RESEARCH_URL || 'https://fanlife.dubelteam.com' }}
      FAN_LIFE_CRON_SECRET: ${{ secrets.FAN_LIFE_CRON_SECRET }}
    steps:
      - name: The studio's secret
        run: |
          if [ ${#FAN_LIFE_CRON_SECRET} -lt 32 ]; then echo "::error::FAN_LIFE_CRON_SECRET is not set"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - name: Club archives (the directors read every club's compiled pack)
        run: |
          npm ci --no-audit --no-fund
          npm run clubs:precompile
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Python tools (the directors import the research and writer modules, which need numpy and Pillow)
        run: pip install -q numpy pillow
      - name: The writer's earlier answers (a pitch is never asked twice)
        uses: actions/cache@v4
        with:
          path: stories-pitch-cache
          key: stories-pitch-${{ github.run_id }}
          restore-keys: stories-pitch-
      - name: Pitch
        working-directory: scripts/football-stories
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_KIDS: ${{ secrets.GEMINI_API_KEY_KIDS }}
          STORIES_GEMINI_MODEL: ${{ vars.STORIES_GEMINI_MODEL }}
          STORIES_PITCH_CACHE: ${{ github.workspace }}/stories-pitch-cache
        run: python -m studio.pitch
