name: I WAS THERE · narration audition
# Reads the same lines with every free, commercially usable voice engine on the runner's CPU and publishes the takes
# (MP3 + audition.json with render speed) on the `matchday-voice` branch, so the owner chooses the narrator by ear.
on:
  workflow_dispatch:
  push:
    paths: ['scripts/football-stories/matchday/voice_audition.py']
permissions:
  contents: write
concurrency:
  group: matchday-voice
  cancel-in-progress: true
jobs:
  audition:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Engines (CPU builds)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng > /dev/null
          pip install -q --extra-index-url https://download.pytorch.org/whl/cpu chatterbox-tts
          pip install -q kokoro-onnx soundfile
          mkdir -p ~/models
          curl -sSL -o ~/models/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -sSL -o ~/models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - name: Audition
        env: {KOKORO_DIR: /home/runner/models}
        run: python3 scripts/football-stories/matchday/voice_audition.py "$RUNNER_TEMP/voice"
      - name: Publish the takes
        if: always()
        run: |
          cd "$RUNNER_TEMP/voice" || exit 0
          git init -q && git checkout -q -b matchday-voice
          git config user.name "fanlife-audition" && git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -qm "Narration audition $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" matchday-voice
