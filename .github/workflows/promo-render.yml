name: FAN LIFE · promo render (Royal Rumble + Legends Manager)
# Owner, 3.11.2026: a film and six Shorts for each game. Every item renders in its own job (in parallel), from
# campaign.json and the live captures on the branch promo-capture; the finished files go to the branch promo-publish.
on:
  push:
    paths: ['scripts/football-stories/promo/render-trigger.txt']
  workflow_dispatch:
    inputs:
      only: {description: 'Item ids, comma-separated (empty = all)', required: false, default: ''}
permissions:
  contents: write
concurrency:
  group: promo-render
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      items: ${{ steps.p.outputs.items }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          only="${{ inputs.only }}"
          [ -z "$only" ] && only="$(sed -n 2p scripts/football-stories/promo/render-trigger.txt)"
          python3 - "$only" <<'P' >> "$GITHUB_OUTPUT"
          import json, sys
          c = json.load(open('scripts/football-stories/promo/campaign.json'))
          want = [x for x in sys.argv[1].split(',') if x.strip()]
          ids = [i['id'] for i in c['items'] if not want or i['id'] in want]
          print('items=' + json.dumps(ids))
          P
  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJson(needs.plan.outputs.items) }}
    env:
      KOKORO_DIR: /home/runner/models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q numpy pillow playwright kokoro-onnx soundfile faster-whisper fonttools brotli
          python -m playwright install --with-deps chromium > /dev/null
      - name: Voice model (cached)
        id: kokoro
        uses: actions/cache@v4
        with: {path: ~/models, key: kokoro-v1.0}
      - if: steps.kokoro.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/models
          curl -sSL -o ~/models/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -sSL -o ~/models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - name: Captures
        run: git clone -q --depth 1 -b promo-capture "https://github.com/${{ github.repository }}.git" "$RUNNER_TEMP/cap"
      - name: Render ${{ matrix.item }}
        run: python3 scripts/football-stories/promo/promo.py scripts/football-stories/promo/campaign.json "${{ matrix.item }}" "$RUNNER_TEMP/out" "$RUNNER_TEMP/cap"
      - uses: actions/upload-artifact@v4
        with: {name: 'promo-${{ matrix.item }}', path: '${{ runner.temp }}/out', retention-days: 5}
  publish:
    needs: render
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {path: out, pattern: 'promo-*', merge-multiple: true}
      - name: Publish (branch promo-publish, kept: items not re-rendered stay)
        run: |
          git clone -q --depth 1 -b promo-publish "https://github.com/${{ github.repository }}.git" pub 2>/dev/null || (mkdir pub && cd pub && git init -q && git checkout -q -b promo-publish)
          cp -r out/. pub/
          cd pub
          git config user.name "fanlife-promo" && git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -qm "Promo render from ${GITHUB_SHA::7}" || true
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" promo-publish
