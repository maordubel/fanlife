name: Drive pull (encrypted)
# Runs only on a drive-pull/* branch: fetches the files listed in .github/drive-pull/request.json from the owner's
# public Drive, encrypts them for the studio's key (.github/drive-pull/pub.pem) and pushes the ciphertext to
# drive-pull-out/<branch>. Nothing readable leaves the runner; the branch is deleted after use.
on:
  push:
    branches: ['drive-pull/**']
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Fetch
        run: python3 .github/drive-pull/pull.py .github/drive-pull/request.json "$RUNNER_TEMP/pull"
      - name: Encrypt and push
        run: |
          cd "$RUNNER_TEMP"
          tar cf pull.tar pull
          openssl rand -hex -out k.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -in pull.tar -out pull.enc -pass file:k.bin
          openssl pkeyutl -encrypt -pubin -inkey "$GITHUB_WORKSPACE/.github/drive-pull/pub.pem" -in k.bin -out k.enc
          rm -f k.bin pull.tar
          mkdir out && split -b 45m pull.enc out/pull.enc.part- && cp k.enc out/
          cd out && git init -q && git checkout -q -b "drive-pull-out/${GITHUB_REF_NAME#drive-pull/}"
          git config user.name "fanlife-pull" && git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -qm "encrypted pull ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "drive-pull-out/${GITHUB_REF_NAME#drive-pull/}"
