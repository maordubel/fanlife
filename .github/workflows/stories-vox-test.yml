name: Football Stories · VOX test (temporary)
# Renders each director's film of one real story in the VOX engine and sends the previews to the owner's Telegram.
# The scripts are written once (or taken from an earlier run's `dtest`). Runs on a push of studio/vox-test.json to a
# non-main branch. Remove after the test.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ['scripts/football-stories/studio/vox-test.json']
permissions: {contents: read, actions: read}
env:
  STORIES_URL: ${{ vars.FAN_LIFE_RESEARCH_URL || 'https://fanlife.dubelteam.com' }}
  FAN_LIFE_CRON_SECRET: ${{ secrets.FAN_LIFE_CRON_SECRET }}
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs: {reuse: '${{ steps.p.outputs.reuse }}'}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: echo "reuse=$(python3 -c "import json;print(json.load(open('scripts/football-stories/studio/vox-test.json')).get('reuse_scripts') or '')")" >> "$GITHUB_OUTPUT"
  write:
    needs: plan
    if: needs.plan.outputs.reuse == ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - name: Club archives and map data
        # the studio researches every club but Hapoel from its compiled pack (content/compiled/<club>.json, not in git)
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund world-atlas@2
          npm run clubs:precompile
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q numpy pillow opencv-python-headless playwright kokoro-onnx soundfile fonttools brotli pillow-heif
          # misaki: the G2P the voice was trained on (studio/pronounce.py); without it the voice falls back to espeak
          pip install -q misaki num2words regex spacy && python -m spacy download en_core_web_sm -q
          python -m playwright install --with-deps chromium > /dev/null
      - name: Voice model (free, cached)
        id: kokoro
        uses: actions/cache@v4
        with: {path: ~/models, key: kokoro-v1.0}
      - if: steps.kokoro.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/models
          curl -sSL -o ~/models/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -sSL -o ~/models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - name: Palettes
        run: |
          mkdir -p node_modules/server-only && echo "{\"name\":\"server-only\",\"main\":\"index.js\"}" > node_modules/server-only/package.json && : > node_modules/server-only/index.js
          npx tsx scripts/football-stories/palettes.ts > /tmp/palettes.json
      - name: The three directors write
        working-directory: scripts/football-stories
        env: {GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}', PALETTES: /tmp/palettes.json, KOKORO_DIR: /home/runner/models}
        run: python -m studio.vox_test write ${{ github.workspace }}/dtest
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: dtest, path: '${{ github.workspace }}/dtest', retention-days: 3, include-hidden-files: true}
  film:
    needs: [plan, write]
    if: always() && (needs.write.result == 'success' || needs.plan.outputs.reuse != '')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy: {fail-fast: false, matrix: {n: [1, 2, 3]}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - name: Club archives and map data
        # the studio researches every club but Hapoel from its compiled pack (content/compiled/<club>.json, not in git)
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund world-atlas@2
          npm run clubs:precompile
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q numpy pillow opencv-python-headless playwright kokoro-onnx soundfile fonttools brotli pillow-heif
          # misaki: the G2P the voice was trained on (studio/pronounce.py); without it the voice falls back to espeak
          pip install -q misaki num2words regex spacy && python -m spacy download en_core_web_sm -q
          python -m playwright install --with-deps chromium > /dev/null
      - name: Voice model (free, cached)
        id: kokoro
        uses: actions/cache@v4
        with: {path: ~/models, key: kokoro-v1.0}
      - if: steps.kokoro.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/models
          curl -sSL -o ~/models/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -sSL -o ~/models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - name: Palettes
        run: |
          mkdir -p node_modules/server-only && echo "{\"name\":\"server-only\",\"main\":\"index.js\"}" > node_modules/server-only/package.json && : > node_modules/server-only/index.js
          npx tsx scripts/football-stories/palettes.ts > /tmp/palettes.json
      - if: needs.plan.outputs.reuse == ''
        uses: actions/download-artifact@v4
        with: {name: dtest, path: '${{ github.workspace }}/dtest'}
      - if: needs.plan.outputs.reuse != ''
        uses: actions/download-artifact@v4
        with: {name: dtest, path: '${{ github.workspace }}/dtest', run-id: '${{ needs.plan.outputs.reuse }}', github-token: '${{ github.token }}'}
      - name: Render this director's film
        working-directory: scripts/football-stories
        env: {GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}', PALETTES: /tmp/palettes.json, KOKORO_DIR: /home/runner/models, STORIES_WORKERS: '4', STORIES_MASTER_PRESET: medium, TELEGRAM_BOT_TOKEN: '${{ secrets.TELEGRAM_BOT_TOKEN }}'}
        run: python -m studio.vox_test ${{ matrix.n }} ${{ github.workspace }}/dtest
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'vox-film-${{ matrix.n }}', path: '${{ github.workspace }}/dtest/out', retention-days: 3}
