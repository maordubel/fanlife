name: Requested club research
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  research:
    if: vars.FAN_LIFE_RESEARCH_URL != ''
    runs-on: ubuntu-latest
    steps:
      - name: Process requested research
        env:
          URL: ${{ vars.FAN_LIFE_RESEARCH_URL }}
          CRON_SECRET: ${{ secrets.FAN_LIFE_CRON_SECRET }}
        run: |
          test ${#CRON_SECRET} -ge 32
          curl --fail --show-error --max-time 90 -H "Authorization: Bearer $CRON_SECRET" "$URL/api/master/cron"
