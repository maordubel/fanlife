name: Football Stories · listener
# Starts a film within about three minutes of "Make the film" (owner, 4.11.2026: "activate the studio, make sure it works").
# GitHub runs a 10-minute schedule only every few hours, so the studio waited hours for its worker. This listener asks
# the studio for work every three minutes; when a film is waiting it starts the worker (workflow_dispatch with the run's own
# token — the one event GITHUB_TOKEN may trigger), and before its time is up it starts its own next run, so it never
# stops. Every round it reports a heartbeat; every three hours it checks that the script writer's key really works (one
# tiny request to the cheapest current Gemini model, never the Pro quota), which the studio shows as its status lights. The hourly schedule only restarts a chain that broke.
# When the owner asks for new pitches (studio → Directors) the peek says so once, and the listener starts stories-pitch.yml.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/stories-watch.yml']   # a change to the listener starts it
  schedule:
    - cron: '17 * * * *'
permissions:
  actions: write
  contents: read
concurrency:
  group: stories-watch
  cancel-in-progress: false
jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      STORIES_URL: ${{ vars.FAN_LIFE_RESEARCH_URL || 'https://fanlife.dubelteam.com' }}
      FAN_LIFE_CRON_SECRET: ${{ secrets.FAN_LIFE_CRON_SECRET }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      STORIES_GEMINI_MODEL: ${{ vars.STORIES_GEMINI_MODEL }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: scripts/football-stories/studio, sparse-checkout-cone-mode: true}
      - name: Listen
        run: |
          set -u
          if [ ${#FAN_LIFE_CRON_SECRET} -lt 32 ]; then echo "::error::FAN_LIFE_CRON_SECRET is not set"; exit 1; fi
          writer_check() {
            python3 scripts/football-stories/studio/writer_check.py 2>/dev/null | tail -1 | grep '^{' || echo '{"provider":"gemini","ok":null,"note":"check could not run"}'
          }
          worker_busy() {
            n=$(gh run list --workflow stories-worker.yml --limit 5 --json status --jq '[.[]|select(.status!="completed")]|length' 2>/dev/null || echo 0)
            [ "${n:-0}" -gt 0 ]
          }
          end=$(( $(date +%s) + 5*3600 + 40*60 ))
          writer=$(writer_check); checked=$(date +%s); cleaned=0
          echo "Writer: $writer"
          while [ "$(date +%s)" -lt "$end" ]; do
            if [ $(( $(date +%s) - checked )) -gt 10800 ]; then writer=$(writer_check); checked=$(date +%s); fi
            peek=$(curl -s --max-time 30 -X POST -H "Authorization: Bearer $FAN_LIFE_CRON_SECRET" -H 'Content-Type: application/json' \
              -d "{\"op\":\"peek\",\"worker\":\"listen-$GITHUB_RUN_ID\",\"health\":{\"writer\":$writer}}" "$STORIES_URL/api/master/stories/worker" || true)
            if [ $(( $(date +%s) - cleaned )) -ge 600 ]; then
              python3 scripts/football-stories/studio/cleanup.py || echo "::warning::Storage cleanup will retry"
              cleaned=$(date +%s)
            fi
            next=$(printf '%s' "$peek" | python3 -c "import sys,json;print(json.load(sys.stdin).get('next') or '')" 2>/dev/null || true)
            # the owner pressed "Ask for new pitches" (studio → Directors): the studio answers pitch:true once per request
            if [ "$(printf '%s' "$peek" | python3 -c "import sys,json;print(bool(json.load(sys.stdin).get('pitch')))" 2>/dev/null || echo False)" = "True" ]; then
              echo "$(date -u +%T) the owner asked for new pitches — starting the directors"
              gh workflow run stories-pitch.yml || echo "::warning::could not start the pitch run"
            fi
            if [ -n "$next" ] && ! worker_busy; then
              echo "$(date -u +%T) film waiting: $next — starting the worker"
              gh workflow run stories-worker.yml || echo "::warning::could not start the worker"
              sleep 90
            fi
            sleep 180
          done
      - name: Keep listening
        if: always()
        run: gh workflow run stories-watch.yml || echo "::warning::could not start the next listener (the hourly schedule will)"
