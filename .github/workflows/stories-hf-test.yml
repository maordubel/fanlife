name: Football Stories · HyperFrames VOX test (temporary)
# Renders one chapter of a real film with VOX on HyperFrames and with the PIL VOX engine, times both and sends the
# HyperFrames cut to the owner's Telegram. Runs on a push of studio/hf_test.py to a non-main branch. Remove after the test.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ['scripts/football-stories/studio/hf_test.py']
permissions: {contents: read}
env:
  STORIES_URL: ${{ vars.FAN_LIFE_RESEARCH_URL || 'https://fanlife.dubelteam.com' }}
  FAN_LIFE_CRON_SECRET: ${{ secrets.FAN_LIFE_CRON_SECRET }}
jobs:
  film:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - name: Node tools and map data
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund world-atlas@2
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q numpy pillow playwright kokoro-onnx soundfile fonttools brotli pillow-heif opencv-python-headless
          pip install -q misaki num2words regex spacy && python -m spacy download en_core_web_sm -q
          python -m playwright install --with-deps chromium > /dev/null
      - name: HyperFrames (pinned) and its Chrome
        working-directory: scripts/football-stories/studio/hyperframes
        env: {HYPERFRAMES_NO_TELEMETRY: '1', HYPERFRAMES_SKIP_SKILLS: '1', HYPERFRAMES_NO_UPDATE_CHECK: '1'}
        run: |
          npm ci --no-audit --no-fund
          npx hyperframes browser ensure
          npx hyperframes doctor | tail -25
      - name: Voice model (free, cached)
        id: kokoro
        uses: actions/cache@v4
        with: {path: ~/models, key: kokoro-v1.0}
      - if: steps.kokoro.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/models
          curl -sSL -o ~/models/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -sSL -o ~/models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - name: Palettes
        run: |
          mkdir -p node_modules/server-only && echo "{\"name\":\"server-only\",\"main\":\"index.js\"}" > node_modules/server-only/package.json && : > node_modules/server-only/index.js
          npx tsx scripts/football-stories/palettes.ts > /tmp/palettes.json
      - name: Render the chapter twice and send the HyperFrames cut
        working-directory: scripts/football-stories
        env: {PALETTES: /tmp/palettes.json, KOKORO_DIR: /home/runner/models, STORIES_WORKERS: '4', TELEGRAM_BOT_TOKEN: '${{ secrets.TELEGRAM_BOT_TOKEN }}'}
        run: python -m studio.hf_test ${{ github.workspace }}/hftest
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: hftest, path: '${{ github.workspace }}/hftest/out', retention-days: 3}
