# TEMPORARY (workstream A, 4.11.2026): one real director-2 script from the free Gemini key, to prove the writer can pass
# the director rules. Writes nothing anywhere; removed before the PR is merged.
name: Director trial
on:
  push:
    branches: [claude/director-brain]
    paths: [.github/workflows/director-trial.yml]
jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q numpy pillow
      - name: Write one director-2 script (Hapoel Tel Aviv 1999/00, 5 minutes, Chronicle)
        working-directory: scripts/football-stories
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, '.')
          from studio import director, research, writer
          from studio.common import read_json, StageError
          from studio.script import validate_script, with_cta
          L = research.build_ledger('hapoel-tel-aviv', '1999/00', read_json(Path('studio/dossiers/hapoel-tel-aviv-1999-00.json'))['claims'])
          director.attach(L)
          L['art_sets'] = []
          brief = {'duration': 5, 'kind': 'season', 'season': '1999/00'}
          cache = Path('/tmp/trial-cache'); cache.mkdir(exist_ok=True)
          try:
              s = writer.write_script(brief, L, cache, print, angle=writer.ANGLES_V3[0])
          except StageError as e:
              print('WRITER FAILED', e.code, str(e)[:3000])
              for f in sorted(cache.glob('writer-*.json')):
                  print('--- attempt', f.name)
              sys.exit(0)
          for a in s.get('_writer') or []:
              print('attempt', a['attempt'], 'errors', len(a['errors']), a['errors'][:12])
          s2 = with_cta(json.loads(json.dumps(s)), 'trial')
          print('AFTER CTA ERRORS', validate_script(s2, L, 5, 'season'))
          print('DIRECTOR', s.get('director'), 'HOOK', s.get('hook'))
          for ci, ch in enumerate(s['chapters']):
              print(f'== {ci + 1}. {ch["title"]}')
              for b in ch['beats']:
                  v = b['visual']
                  print(f"  [{v['type']}{'/' + b['camera'] if b.get('camera') else ''}{'/' + b['pace'] if b.get('pace') else ''}{'/' + b['sfx'] if b.get('sfx') else ''}] {b['narration']}")
                  if v['type'] == 'trailer':
                      print('      ', ' | '.join(v['lines']))
          print('TITLE', s['title_candidates'][s['selected']]['title'])
          PY
