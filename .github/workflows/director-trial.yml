# TEMPORARY (workstream A, 4.11.2026): one real director-2 script from the free Gemini key, to prove the writer can pass
# the director rules. Writes nothing anywhere; removed before the PR is merged.
name: Director trial
on:
  push:
    branches: [claude/director-brain]
    paths: [.github/workflows/director-trial.yml]
jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q numpy pillow
      - name: The Trailer Cut writes Hapoel Tel Aviv 1999/00, and pitches one film
        working-directory: scripts/football-stories
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, '.')
          from studio import director, research, writer
          from studio.directors import BY_ID
          from studio.common import read_json, StageError
          L = research.build_ledger('hapoel-tel-aviv', '1999/00', read_json(Path('studio/dossiers/hapoel-tel-aviv-1999-00.json'))['claims'])
          director.attach(L)
          L['art_sets'] = []
          cache = Path('/tmp/trial-cache'); cache.mkdir(exist_ok=True)
          try:
              s = writer.write_script({'duration': 4, 'kind': 'season', 'season': '1999/00'}, L, cache, print, director=BY_ID['trailer'])
              for a in s.get('_writer') or []:
                  print('attempt', a['attempt'], 'errors', len(a['errors']), a['errors'][:12])
              print('HOOK', s.get('hook'))
              for ci, ch in enumerate(s['chapters']):
                  print(f'== {ci + 1}. {ch["title"]}')
                  for b in ch['beats']:
                      v = b['visual']
                      print(f"  [{v['type']}{'/' + b['camera'] if b.get('camera') else ''}] {b['narration']}" + (('  ⟨' + ' | '.join(v['lines']) + '⟩') if v['type'] == 'trailer' else ''))
              print('TITLE', s['title_candidates'][s['selected']]['title'])
          except StageError as e:
              print('WRITER FAILED', e.code, str(e)[:3000])
          c = director.candidates(['hapoel-tel-aviv'], 3)[:10]
          for d in ('broadcaster', 'terrace'):
              try:
                  print('PITCH', json.dumps(writer.write_pitch(BY_ID[d], c, cache, print), ensure_ascii=False, indent=1))
              except StageError as e:
                  print('PITCH FAILED', d, e.code, str(e)[:1500])
          PY
