name: Album · FM face names
# THE ALBUM (28.11.2026): the owner's Football Manager face packs name pictures only by FM id; this resolves each id to a
# name on sortitoutsi and commits content/generated/fm-person-names.json back to the branch.
on:
  push:
    branches: [claude/album-fm-names]
permissions:
  contents: write
jobs:
  names:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 scripts/album/fm_names.py scripts/album/fm-ids.json
      - run: |
          git config user.name "fanlife-album" && git config user.email "actions@users.noreply.github.com"
          git add content/generated/fm-person-names.json && git commit -qm "album: FM face names" && git push -q
