name: Studio · Flow mailbox
# The Flow operator's mailbox (docs/fanlife/70-flow-operator.md). Claude makes the pictures and clips in Google Flow on
# the owner's computer and leaves them in the GitHub release `flow-inbox`; this puts them into the studio with the
# worker's cron secret (no studio login anywhere) and queues the edit when a Short's set is complete.
#   mode=queue  → prints what Flow should make now (between FLOW-QUEUE-BEGIN / FLOW-QUEUE-END)
#   mode=intake → takes in everything waiting in flow-inbox (also every hour, in case a dispatch was missed)
on:
  workflow_dispatch:
    inputs:
      mode: {description: 'queue or intake', required: true, default: intake, type: choice, options: [intake, queue]}
  schedule:
    - cron: '41 * * * *'
permissions:
  contents: write  # deletes the assets it took in
concurrency:
  group: stories-flow-${{ inputs.mode || 'intake' }}
  cancel-in-progress: false
jobs:
  mailbox:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STORIES_URL: ${{ vars.FAN_LIFE_RESEARCH_URL || 'https://fanlife.dubelteam.com' }}
      FAN_LIFE_CRON_SECRET: ${{ secrets.FAN_LIFE_CRON_SECRET }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q pillow
      - working-directory: scripts/football-stories
        run: python3 -m studio.flow_intake "${{ inputs.mode || 'intake' }}"
