name: Football Stories · the odds before kick-off
# Both sides' ClubElo rating on the day of every archive match (scripts/football-stories/studio/elo.py), so a film can
# say who was expected to win: the underdog night, the upset of a season. ClubElo is free; this machine's network is
# open where the studio's sandbox is not. Commits content/generated/elo/match-elo.json to the branch it ran on.
on:
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * 1'
  push:
    paths: ['scripts/football-stories/studio/elo.py', '.github/workflows/stories-elo.yml']
permissions:
  contents: write
concurrency:
  group: stories-elo-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  elo:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Fetch the ratings
        run: |
          pip install -q numpy pillow
          cd scripts/football-stories && python3 -m studio.elo fetch
      - name: Commit
        run: |
          git config user.name "fanlife-elo" && git config user.email "actions@users.noreply.github.com"
          git add content/generated/elo/match-elo.json
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git commit -qm "Elo: both sides' rating on the day of every archive match ($(date -u +%F))"
          git pull -q --rebase origin "${{ github.ref_name }}" && git push -q origin "HEAD:${{ github.ref_name }}"
