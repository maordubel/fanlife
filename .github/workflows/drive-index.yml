name: Drive index (daily)
# Lists the owner's public Drive library live, rebuilds docs/fanlife/drive-library/inventory.json and the tagged
# index.json (studio/drive_index.py, tag map tags.json) and commits them when they changed — so the studio, the shop
# and the media index always see today's library with the owner's tags. A folder with no tags is printed in the log
# and listed in index.json `untagged`. No key needed: the library is shared "anyone with the link".
on:
  schedule:
    - cron: '17 3 * * *'   # 05:17 Athens (UTC+2)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: drive-index
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: List the Drive and rebuild the index
        working-directory: scripts/football-stories
        run: python -m studio.drive_index build --live
      - name: Commit when changed
        run: |
          if git diff --quiet -- docs/fanlife/drive-library; then echo "no change"; exit 0; fi
          git config user.name "fanlife-drive-index" && git config user.email "actions@users.noreply.github.com"
          git add docs/fanlife/drive-library
          git commit -qm "drive index: the library as of $(date -u +%F)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
