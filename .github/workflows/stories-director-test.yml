name: Football Stories · Director's Cut test (temporary)
# Writes the three directors' scripts for one real story, renders each director's film and sends the previews to the
# owner's Telegram. Runs on a push of studio/director-test.json to a non-main branch, or by hand. Remove after the test.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ['scripts/football-stories/studio/director-test.json']
permissions: {contents: read}
jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - name: Club archives and map data
        # the studio researches every club but Hapoel from its compiled pack (content/compiled/<club>.json, not in git)
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund world-atlas@2
          npm run clubs:precompile
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q numpy pillow playwright kokoro-onnx soundfile fonttools brotli pillow-heif
          # misaki: the G2P the voice was trained on (studio/pronounce.py); without it the voice falls back to espeak
          pip install -q misaki num2words regex spacy && python -m spacy download en_core_web_sm -q
          python -m playwright install --with-deps chromium > /dev/null
      - name: Voice model (free, cached)
        id: kokoro
        uses: actions/cache@v4
        with: {path: ~/models, key: kokoro-v1.0}
      - if: steps.kokoro.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/models
          curl -sSL -o ~/models/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -sSL -o ~/models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - name: Palettes
        run: |
          mkdir -p node_modules/server-only && echo "{\"name\":\"server-only\",\"main\":\"index.js\"}" > node_modules/server-only/package.json && : > node_modules/server-only/index.js
          npx tsx scripts/football-stories/palettes.ts > /tmp/palettes.json
      - name: The three directors write
        working-directory: scripts/football-stories
        env: {GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}', PALETTES: /tmp/palettes.json, KOKORO_DIR: /home/runner/models}
        run: python -m studio.director_test write ${{ github.workspace }}/dtest
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: dtest, path: '${{ github.workspace }}/dtest', retention-days: 3, include-hidden-files: true}
  film:
    needs: write
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy: {fail-fast: false, matrix: {n: [1, 2, 3]}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - name: Club archives and map data
        # the studio researches every club but Hapoel from its compiled pack (content/compiled/<club>.json, not in git)
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund world-atlas@2
          npm run clubs:precompile
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q numpy pillow playwright kokoro-onnx soundfile fonttools brotli pillow-heif
          # misaki: the G2P the voice was trained on (studio/pronounce.py); without it the voice falls back to espeak
          pip install -q misaki num2words regex spacy && python -m spacy download en_core_web_sm -q
          python -m playwright install --with-deps chromium > /dev/null
      - name: Voice model (free, cached)
        id: kokoro
        uses: actions/cache@v4
        with: {path: ~/models, key: kokoro-v1.0}
      - if: steps.kokoro.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/models
          curl -sSL -o ~/models/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -sSL -o ~/models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - name: Palettes
        run: |
          mkdir -p node_modules/server-only && echo "{\"name\":\"server-only\",\"main\":\"index.js\"}" > node_modules/server-only/package.json && : > node_modules/server-only/index.js
          npx tsx scripts/football-stories/palettes.ts > /tmp/palettes.json
      - uses: actions/download-artifact@v4
        with: {name: dtest, path: '${{ github.workspace }}/dtest'}
      - name: Render this director's film
        working-directory: scripts/football-stories
        env: {GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}', PALETTES: /tmp/palettes.json, KOKORO_DIR: /home/runner/models, STORIES_WORKERS: '4', STORIES_MASTER_PRESET: medium, TELEGRAM_BOT_TOKEN: '${{ secrets.TELEGRAM_BOT_TOKEN }}'}
        run: python -m studio.director_test ${{ matrix.n }} ${{ github.workspace }}/dtest
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'film-${{ matrix.n }}', path: '${{ github.workspace }}/dtest/out', retention-days: 3}
