name: FAN LIFE · promo capture (Royal Rumble + Legends Manager)
# Owner, 3.11.2026: an ad series for Legends Manager and Royal Rumble. This films the live games on a phone (stills +
# screen recordings) and pushes them to the branch promo-capture, where promo-render reads them.
on:
  push:
    paths: ['scripts/football-stories/promo/capture-trigger.txt']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: promo-capture
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Tools
        run: |
          pip install -q playwright pillow
          python -m playwright install --with-deps chromium > /dev/null
      - name: Keep what is not re-filmed
        run: git clone -q --depth 1 -b promo-capture "https://github.com/${{ github.repository }}.git" "$RUNNER_TEMP/cap" || mkdir -p "$RUNNER_TEMP/cap"
      - name: Film the games
        run: |
          games="$(sed -n 2p scripts/football-stories/promo/capture-trigger.txt)"
          clubs="$(sed -n 3p scripts/football-stories/promo/capture-trigger.txt)"
          GAMES="$games" python3 scripts/football-stories/promo/capture.py "$RUNNER_TEMP/cap" ${clubs:-olympiacos panathinaikos aek-athens}
      - name: Publish (branch promo-capture)
        run: |
          cd "$RUNNER_TEMP/cap" && rm -rf .git && git init -q && git checkout -q -b promo-capture
          git config user.name "fanlife-promo" && git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -qm "Promo capture from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" promo-capture
