name: Short sample (animated)
# Renders the animated Shorts in docs/fanlife/shorts-samples/*.json with Gemini-drawn sets and cast (owner, 8.11.2026),
# so a sample can be judged before the studio uses the look. Runs when a sample changes, or by hand.
on:
  workflow_dispatch:
  push:
    paths: ['docs/fanlife/shorts-samples/*.gemini-api.json']
permissions:
  contents: read
concurrency:
  group: short-sample-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q numpy pillow kokoro-onnx soundfile misaki num2words regex spacy brotli fonttools
          python -m spacy download en_core_web_sm -q
      - name: HyperFrames
        working-directory: scripts/football-stories/studio/hyperframes
        env: {HYPERFRAMES_NO_TELEMETRY: '1', HYPERFRAMES_SKIP_SKILLS: '1', HYPERFRAMES_NO_UPDATE_CHECK: '1'}
        run: |
          npm ci --no-audit --no-fund
          npx hyperframes browser ensure
      - name: Voice model (cached)
        id: kokoro
        uses: actions/cache@v4
        with: {path: ~/models, key: kokoro-v1.0}
      - if: steps.kokoro.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/models
          curl -sSL -o ~/models/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -sSL -o ~/models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - name: Drawn pictures (cached — a picture is paid for once)
        uses: actions/cache@v4
        with:
          path: ~/genart
          key: genart-${{ github.run_id }}
          restore-keys: genart-
      - name: Render
        working-directory: scripts/football-stories
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_KIDS: ${{ secrets.GEMINI_API_KEY_KIDS }}
          STORIES_IMAGE_MODEL: ${{ vars.STORIES_IMAGE_MODEL }}
          STORIES_GENART_CACHE: /home/runner/genart
          KOKORO_DIR: /home/runner/models
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          for f in ../../docs/fanlife/shorts-samples/*.gemini-api.json; do
            n=$(basename "$f" .json)
            text=$(python3 -c "import json,sys;d=json.load(open(sys.argv[1]));print(' '.join(b['say'] for b in d['beats']))" "$f")
            python3 -m studio.cartoon.make --text "$text" --cartoon "$f" --look animated --out "$RUNNER_TEMP/out/$n.mp4" \
              --work "$RUNNER_TEMP/work-$n" --bans "" --tag "FAN LIFE · CLASSIFIED"
            for t in 1 4 8 12 16 20; do ffmpeg -v error -y -ss $t -i "$RUNNER_TEMP/out/$n.mp4" -frames:v 1 "$RUNNER_TEMP/out/$n-$t.jpg" || true; done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: short-samples
          path: |
            ${{ runner.temp }}/out
            ~/genart
          retention-days: 7
