name: CLASSIFIED · VOX test (temporary)
# Renders FILE 01 on the VOX case board (comic/casefile.py) through the same produce path the studio's 'classified'
# job kind runs, with the owner's approval recorded on that job, and sends it to the owner's Telegram as a DRAFT
# labelled "CLASSIFIED · VOX TEST · FILE 01". Runs on a push of comic/vox-test.json to a non-main branch. Remove after the test.
on:
  push:
    branches-ignore: [main]
    paths: ['scripts/football-stories/comic/vox-test.json']
permissions: {contents: read}
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      STORIES_URL: ${{ vars.FAN_LIFE_RESEARCH_URL || 'https://fanlife.dubelteam.com' }}
      CLASSIFIED_DEPTH_MODEL: /home/runner/models/depth-anything-v2-small.onnx
      CLASSIFIED_CACHE: /home/runner/.cache/fanlife-classified/layers
      CLASSIFIED_VOICE_CACHE: /home/runner/.cache/fanlife-classified/voice
      KOKORO_DIR: /home/runner/kokoro
      STORIES_KOKORO_VOICE: bm_george
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q numpy pillow opencv-python-headless onnxruntime fonttools brotli kokoro-onnx soundfile
          pip install -q misaki num2words regex spacy && python -m spacy download en_core_web_sm -q
      - name: Narrator model
        id: kokoro
        uses: actions/cache@v4
        with: {path: ~/kokoro, key: kokoro-v1.0}
      - if: steps.kokoro.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/kokoro
          curl -fsSL --retry 3 -o ~/kokoro/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -fsSL --retry 3 -o ~/kokoro/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - name: Depth model
        id: depth
        uses: actions/cache@v4
        with: {path: ~/models, key: depth-anything-v2-small-onnx-v1}
      - if: steps.depth.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/models
          curl -fsSL --retry 3 -o ~/models/depth-anything-v2-small.onnx https://huggingface.co/onnx-community/depth-anything-v2-small/resolve/main/onnx/model.onnx || rm -f ~/models/depth-anything-v2-small.onnx
      - name: Layer and voice caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/fanlife-classified/layers
            ~/.cache/fanlife-classified/voice
          key: classified-produce-file01-${{ github.run_id }}
          restore-keys: classified-produce-file01-
      - name: The owner's approval, unchanged since the click (the studio job's record)
        working-directory: scripts/football-stories
        run: python3 -c "import json;from studio.kinds import check_approval;print(check_approval(json.load(open('comic/vox-test.json'))['spec']))"
      - name: The owner's panels from Drive (runner temp only)
        run: python3 scripts/football-stories/comic/drive_fetch.py --file file01 --out "$RUNNER_TEMP/panels" --report "$RUNNER_TEMP/fetch.json"
      - name: Roles
        run: python3 scripts/football-stories/comic/roles.py --panels "$RUNNER_TEMP/panels" --file file01
      - name: Produce on the VOX case board
        run: |
          python3 scripts/football-stories/comic/produce.py --episode scripts/football-stories/comic/episodes/file01-the-bottle.json \
            --panels "$RUNNER_TEMP/panels" --out "$RUNNER_TEMP/job" --approved
          python3 -c "import json;r=json.load(open('$RUNNER_TEMP/job/out/report.json'));print({k:r.get(k) for k in ('engine','seconds','render_seconds','music','stamps','dropped_fx','missing','qa_ok')})"
          cat "$RUNNER_TEMP/job/out/qa.json"
      - name: Flicker, measured on the master
        run: |
          python3 - <<'PY'
          import cv2, numpy as np, os
          cap = cv2.VideoCapture(os.environ['RUNNER_TEMP'] + '/job/out/master.mp4'); prev = None; d = []
          while True:
              ok, f = cap.read()
              if not ok: break
              g = cv2.cvtColor(cv2.resize(f, (480, 270), interpolation=cv2.INTER_AREA), cv2.COLOR_BGR2GRAY).astype(np.float32).mean()
              if prev is not None: d.append(abs(g - prev))
              prev = g
          d = np.array(d); print('frames %d · mean |Δluma| %.3f · p99 %.3f · max %.3f' % (len(d) + 1, d.mean(), np.percentile(d, 99), d.max()))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classified-vox-file01
          path: |
            ${{ runner.temp }}/job/out/*.mp4
            ${{ runner.temp }}/job/out/*.json
            ${{ runner.temp }}/job/out/*.txt
            ${{ runner.temp }}/job/out/*.jpg
            ${{ runner.temp }}/job/contact-sheet.jpg
          retention-days: 3
          if-no-files-found: warn
      - name: The DRAFT to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FAN_LIFE_CRON_SECRET: ${{ secrets.FAN_LIFE_CRON_SECRET }}
        run: |
          o="$RUNNER_TEMP/job/out"
          python3 scripts/football-stories/comic/telegram_send.py "$o/preview-telegram.mp4" \
            --document "$o/telegram-draft.txt" \
            --caption "🗂 CLASSIFIED · VOX TEST · FILE 01 — DRAFT, not uploaded, not published. The perfume case on the VOX case board: steady prints, one camera gliding across the file, no flicker."
