name: Football Stories · narrator audition
# The same name-heavy documentary lines read by every narrator candidate (studio/narrator_audition.py), checked by
# Whisper, and sent to the owner's Telegram as short videos so he chooses by ear. The takes live on a temporary public
# branch only while Telegram fetches them; the branch is deleted at the end of the run.
on:
  workflow_dispatch:
  push:
    paths: ['scripts/football-stories/studio/narrator_audition.py']
permissions:
  contents: write
concurrency:
  group: stories-narrator-audition
  cancel-in-progress: true
jobs:
  audition:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KOKORO_DIR: /home/runner/models
      FAN_LIFE_URL: ${{ vars.FAN_LIFE_RESEARCH_URL }}
      CRON_SECRET: ${{ secrets.FAN_LIFE_CRON_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # the narrator as the owner heard it, and the same narrator with every name researched (owner, 8.11.2026)
      AUDITION_TAKES: A,B
      BRANCH: narrator-audition-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Engines (CPU)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          pip install -q kokoro-onnx soundfile numpy faster-whisper misaki num2words regex spacy phonemizer espeakng-loader
          python -m spacy download en_core_web_sm -q
          mkdir -p ~/models
          curl -sSL -o ~/models/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -sSL -o ~/models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - name: Audition
        working-directory: scripts/football-stories
        env:
          AUDITION_RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ env.BRANCH }}
        run: python3 -m studio.narrator_audition "$RUNNER_TEMP/voice" --send
      - name: Publish the takes for the delivery
        run: |
          cd "$RUNNER_TEMP/voice"
          mkdir pub && cp *.mp4 audition.json pub/ && cd pub
          git init -q && git checkout -q -b "$BRANCH"
          git config user.name "fanlife-audition" && git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -qm "Narrator audition $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$BRANCH"
      - name: Send to Telegram
        run: node scripts/football-stories/matchday/deliver.mjs "$RUNNER_TEMP/voice/delivery.json"
      - name: Report
        if: always()
        run: cat "$RUNNER_TEMP/voice/audition.json" || true
      - name: Delete the temporary branch
        if: always()
        run: git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" --delete "$BRANCH" || true
