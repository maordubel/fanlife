<!--
  TOMBSTONE-ADJACENT, not retired — see rule 26 for the pattern this follows without
  quite being one: the file cannot be deleted, but it also cannot stay what it was.

  Next's file-convention router treats the presence of `app/icon.svg` as a favicon
  ROUTE and puts a <link rel="icon"> for it in every page's <head> — a separate,
  competing source from the `icons` field `app/layout.tsx` already declares (rule 8:
  the badge, `public/brand/logo*.png`, is "the identity everywhere"). Two uncoordinated
  sources for the one asset is exactly the defect rule 8 warns about, and the file
  Next's convention was actually serving was a generic floodlight glyph nobody in this
  project drew — not Maor's artwork, not even close.

  Deleting this file does not exist as an option (rule 26, and GitHub's web uploader
  cannot delete a path even if it did). Redirecting it like a retired route does not
  exist either — a favicon route has no `next/navigation`, it is an image. So instead
  of two sources disagreeing, they now say the same thing: this file's content IS the
  badge — `public/brand/logo-48.png`, already de-yellowed by `scripts/brand/badge.py`
  (rule 8) — inlined as a data URI so the favicon route needs no second file on disk to
  drift from the one `layout.tsx` points at. Whichever source a given browser honours,
  the tab shows Maor's badge either way.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <image href="data:image/png;base64," width="48" height="48"/>
</svg>
